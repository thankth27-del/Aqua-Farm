<!DOCTYPE html>
<html lang="th">
<head>
  <!-- แทนที่ด้วยค่า --base-href ตอน build (GitHub Actions ใส่ /<ชื่อ repo>/ ให้อัตโนมัติ) -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AQUA FARM — From Farm to Food เกมจำลองฟาร์มปลา เตรียมเสบียงรับมือภัยพิบัติ">

  <!-- ภาพตัวอย่างลิงก์ (Facebook / LINE / X / Discord) — ภาพสร้างจาก tool/make_og.mjs
       og:image ต้องเป็นลิงก์เต็ม ถ้าย้าย repo หรือโดเมน ให้แก้ URL สองบรรทัดนี้ -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AQUA FARM">
  <meta property="og:locale" content="th_TH">
  <meta property="og:title" content="AQUA FARM — ฟาร์มปลา เตรียมเสบียง รับมือภัยพิบัติ">
  <meta property="og:description" content="เลี้ยงปลา ทำอาหาร ถนอมอาหาร และเตรียมเสบียงให้รอดจากน้ำท่วม ภัยแล้ง น้ำเสีย และอากาศร้อนจัด เล่นฟรีบนมือถือและคอม">
  <meta property="og:url" content="https://thankth27-del.github.io/Aqua-Farm/">
  <meta property="og:image" content="https://thankth27-del.github.io/Aqua-Farm/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="โลโก้ AQUA FARM สีทอง มีปลาหลายชนิดกระโดดพ้นน้ำรอบโลโก้">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AQUA FARM — ฟาร์มปลา เตรียมเสบียง รับมือภัยพิบัติ">
  <meta name="twitter:description" content="เลี้ยงปลา ทำอาหาร และเตรียมเสบียงให้รอดจากภัยพิบัติ เล่นฟรีบนมือถือและคอม">
  <meta name="twitter:image" content="https://thankth27-del.github.io/Aqua-Farm/og.png">

  <!-- เต็มจอถึงขอบ (รอยบาก / home indicator) — แอปใช้ SafeArea กันเนื้อหาไม่ให้โดนบัง -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F3A49">

  <!-- iPhone: Add to Home Screen แล้วเปิดเต็มจอแบบแอป (ไม่มีแถบ Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AQUA FARM">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>AQUA FARM</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #04161C; overscroll-behavior: none; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
