# Build Flutter Web แล้ว deploy ขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
# ต้องตั้งค่าครั้งเดียว: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ไม่ยกเลิก run ที่กำลังทำ (กันกรณีกด Re-run run เก่าแล้วไปยกเลิก run ใหม่)
# run ที่รอคิวอยู่จะถูกแทนด้วย run ใหม่กว่าเอง
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # กันเว็บย้อนเวอร์ชัน: ถ้า commit ของ run นี้ไม่ใช่ล่าสุดของ main (เช่นกด Re-run run เก่า)
      # ให้ล้มตรงนี้ ไม่ build/deploy ทับเวอร์ชันใหม่กว่า
      - name: Make sure this is the latest main
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "run: $GITHUB_SHA  main: $LATEST"
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "::error::commit นี้ไม่ใช่ล่าสุดของ main ($LATEST) ไม่ deploy เพื่อกันเว็บย้อนเป็นเวอร์ชันเก่า ให้ Re-run run ล่าสุดแทน"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # base-href ต้องตรงกับชื่อ repo: https://<user>.github.io/<repo>/ → /<repo>/
      # ยกเว้น repo ชื่อ <user>.github.io ซึ่งอยู่ที่รากโดเมน → /
      - name: Compute base-href
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "href=$BASE" >> "$GITHUB_OUTPUT"
          echo "base-href = $BASE"

      # ฝังเวอร์ชัน (commit 7 ตัว + เวลา build ไทย) ไว้แสดงในเมนูพัก
      - name: Build web
        run: |
          STAMP=$(TZ=Asia/Bangkok date '+%d/%m/%Y %H:%M')
          flutter build web --release --no-web-resources-cdn \
            --base-href "${{ steps.base.outputs.href }}" \
            --dart-define=BUILD_SHA=${GITHUB_SHA::7} \
            --dart-define="BUILD_TIME=$STAMP"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
