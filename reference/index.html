<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AQUA FARM — From Farm to Food (Prototype)</title>
<style>
:root{--k:#0a2229;--bg:#04161c;--pn:#0f3a49;--pu:#0E7490;--pl:#E8DCC4;--go:#e9b949;--mu:#E8DCC4;--rd:#e0584d}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(#0b3a45,#04161c);color:#fff;font-family:Tahoma,'Noto Sans Thai',sans-serif;font-size:15px;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw - 24px,(100vh - 24px)*16/9);aspect-ratio:16/9;background:#000;box-shadow:0 0 0 4px var(--k),0 0 0 8px var(--pu),0 0 0 12px var(--k);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
img.i{image-rendering:pixelated;vertical-align:middle}
#side{position:absolute;left:0;top:0;bottom:0;width:15%;min-width:128px;background:linear-gradient(#0f3a49f2,#0b2f3af2);border-right:4px solid var(--k);box-shadow:inset -4px 0 0 var(--pu);padding:10px 8px;display:flex;flex-direction:column;gap:4px;z-index:5}
#side.off{display:none}
.logo{text-align:center;color:var(--go);font-weight:bold;font-size:17px;line-height:1.1;text-shadow:2px 2px 0 #000;margin-bottom:6px}.logo small{display:block;color:var(--mu);font-size:11px}
.mi{display:flex;align-items:center;gap:8px;padding:5px 8px;background:transparent;border:3px solid transparent;color:#fff;font:inherit;font-weight:bold;cursor:pointer;text-align:left;transition:transform .12s,background .12s}
.mi:hover{transform:translateX(5px);background:#2d7f8f;border-color:var(--pl)}
.mi.on{background:var(--go);color:var(--k);border-color:#fff3c4;transform:translateX(5px)}
#hud{position:absolute;top:2.2%;left:calc(15% + 14px);right:14px;display:flex;gap:10px;align-items:center;z-index:4;flex-wrap:wrap}
#hud.hs{left:14px}
.plq{background:var(--pn);box-shadow:0 0 0 3px var(--k),0 0 0 5px var(--pu);padding:4px 10px;display:flex;align-items:center;gap:7px;font-weight:bold;margin:3px}
.seg{width:92px;height:14px;background:var(--k);border:2px solid var(--k)}
.seg i{display:block;height:100%;background:repeating-linear-gradient(90deg,#69b4e6 0 8px,#3e7cb8 8px 10px);transition:width .4s}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.35}}
#ui{position:absolute;inset:0;z-index:3;pointer-events:none}
#ui>*{pointer-events:auto}
.win{position:absolute;background:#0f3a49f5;box-shadow:0 0 0 4px var(--k),0 0 0 8px var(--pu),0 0 0 12px var(--k),inset 0 4px 0 #ffffff14;padding:14px 16px;overflow:auto;max-height:78%}
.win.c{left:calc(15% + 4%);right:4%;top:15%}
.win.n{left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,70%);max-height:90%;text-align:center}
.win.r{right:3.5%;top:14%}
.win.in{animation:pop .3s steps(6)}@keyframes pop{from{opacity:0;margin-top:16px}to{opacity:1;margin-top:0}}
.win::-webkit-scrollbar{width:10px}.win::-webkit-scrollbar-thumb{background:var(--pu)}
h2{margin:0 0 8px;color:var(--go);text-shadow:2px 2px 0 #000;font-size:21px}
h3{margin:0;font-size:15px}p{margin:3px 0;color:var(--mu);font-size:13px}
.big{font-size:44px;color:var(--go);font-weight:bold;text-shadow:3px 3px 0 #000;margin:4px 0}
.btn{background:var(--pu);color:#fff;border:3px solid var(--pl);padding:7px 12px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 var(--k);transition:transform .1s,filter .1s;margin:3px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-2px)}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--k)}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.go{background:var(--go);border-color:#fff3c4;color:var(--k)}.btn.dk{background:#164E63}
.btn.w{width:100%;padding:11px;font-size:17px;margin:5px 0}
.gr{display:flex;flex-wrap:wrap;gap:12px}
.slot{width:112px;background:#14505f;border:3px solid var(--k);box-shadow:inset 0 0 0 3px #2d7f8f;padding:8px 4px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative}
.slot:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 3px var(--go)}
.slot.dis{opacity:.45;cursor:not-allowed}
.slot b{display:block;font-size:13px;margin-top:3px}.slot span{font-size:12px;color:var(--go);font-weight:bold}
.cnt{position:absolute;right:3px;top:3px;background:var(--k);color:#fff;font-size:11px;font-weight:bold;padding:1px 5px}
.rc{display:flex;gap:10px;align-items:center;background:#14505f;border:3px solid var(--k);box-shadow:inset 0 0 0 3px #2d7f8f;padding:8px 10px;margin-bottom:10px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:3px;background:var(--k);padding:2px 6px;font-size:12px;margin-right:5px;font-weight:bold}
.mini.no{color:#ff8f86}
.bar{height:16px;background:var(--k);border:3px solid var(--k);margin:3px 0 7px;box-shadow:0 0 0 2px #2d7f8f}.bar i{display:block;height:100%;transition:width .4s;background-image:repeating-linear-gradient(90deg,transparent 0 8px,#00000055 8px 10px)}
.gd{font-size:84px;font-weight:bold;line-height:1;text-shadow:4px 4px 0 #000}
table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:2px solid #164E63;font-size:14px}
.bub{position:absolute;left:calc(15% + 5%);right:5%;bottom:4%;background:#fff;color:var(--k);padding:9px 14px;font-weight:bold;box-shadow:0 0 0 3px var(--k),0 0 0 6px var(--go);text-align:center}
.warnb{position:absolute;left:calc(15% + 5%);bottom:16%;background:#3a1620;box-shadow:0 0 0 3px var(--k),0 0 0 6px var(--rd);padding:7px 14px;font-weight:bold;display:flex;gap:8px;align-items:center}
input{font:inherit;padding:8px;background:var(--k);color:#fff;border:3px solid var(--pl);width:70%;text-align:center;user-select:text}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--go);color:var(--k);padding:7px 16px;font-weight:bold;box-shadow:0 0 0 3px var(--k),0 0 0 6px #fff;animation:pop .25s steps(4)}
#toast div.bad{background:var(--rd);color:#fff}
.pips{display:flex;gap:6px}.pips i{width:22px;height:22px;background:var(--k);box-shadow:inset 0 0 0 3px #2d7f8f}.pips i.l{background:var(--rd);box-shadow:inset 0 0 0 3px #ffb3ac}
.mask{position:absolute;inset:0;background:#000a;z-index:8;pointer-events:auto}
.mrow{display:flex;align-items:center;gap:5px;font-size:10px;line-height:1}.mrow span{width:36px;color:var(--mu)}
.mb{height:6px;background:var(--k);width:110px;margin:2px 0}.mb i{display:block;height:100%;transition:width .3s}
.pf{cursor:pointer;gap:10px}.pf:hover{filter:brightness(1.2)}
.hl{animation:hlp .8s steps(2) infinite}@keyframes hlp{50%{box-shadow:0 0 0 3px var(--k),0 0 0 7px var(--go)}}
.mi.hl{background:#2d7f8f;border-color:var(--go)}
.tut{position:absolute;left:calc(15% + 3%);bottom:3%;width:min(620px,60%);background:#fff;color:var(--k);padding:8px 14px;box-shadow:0 0 0 3px var(--k),0 0 0 6px var(--go);z-index:6;pointer-events:auto}
.tut .btn{font-size:12px;padding:3px 10px}.tut .dots{color:#0E7490;letter-spacing:2px}
#ui.tutOn .win{max-height:60%}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:13px}
.ok{color:#7be07a}.no{color:#ff8f86}
.win.r{width:44%}
.rc h3{margin:0}
.tagc{display:inline-block;color:#0a2229;font-size:11px;font-weight:bold;padding:1px 6px;margin-left:6px}
select{font:inherit;background:var(--k);color:#fff;border:3px solid var(--pl);padding:4px}
.rc{margin-bottom:8px}
@media (max-width:760px){#side{width:50px;min-width:50px;padding:6px 3px}.mi span,.logo{display:none}.mi{padding:4px}#hud{left:58px;gap:4px}.win.c{left:58px;right:2%}.bub,.warnb,.tut{left:58px}.win.r{width:72%}.tut{width:84%}.plq{padding:2px 6px;font-size:12px}}
</style></head><body>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function spr(x,t,px,py,s){const F=FISH[t];x.fillStyle=F.f;x.fillRect(px+8*s,py+s,s,3*s);x.fillRect(px+9*s,py,s,5*s);x.fillStyle=F.c;x.fillRect(px+s,py,6*s,5*s);x.fillRect(px,py+s,8*s,3*s);
 if(F.st){x.fillStyle='#2f3a18';x.fillRect(px+s,py+2*s,7*s,s)}if(F.hu){x.fillStyle=F.c;x.fillRect(px+3*s,py-s,3*s,s)}if(F.wh){x.fillStyle='#0a2229';x.fillRect(px-s,py+2*s,s,s);x.fillRect(px-s,py+4*s,s,s)}
 x.fillStyle='#fff';x.fillRect(px+s,py+s,s,s);x.fillStyle='#000';x.fillRect(px+s,py+s,s,s)}
const IC={};
function ico(n,w=34){if(!IC[n]){const c=document.createElement('canvas');const x=c.getContext('2d');
 if(n[0]==='f'&&n[1]==='_'){c.width=12;c.height=7;spr(x,n.slice(2),1,1,1)}else{c.width=12;c.height=12;MAPS[n].split('|').forEach((r,y)=>{[...r].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(i,y,1,1)}})})}
 IC[n]=[c.toDataURL(),c.width,c.height,c]}
 const d=IC[n];return `<img class="i" src="${d[0]}" style="width:${w}px;height:${Math.round(w*d[2]/d[1])}px">`}
const icc=n=>{ico(n);return IC[n][3]};
// ----- state -----
const def=()=>({v:4,slotName:'',char:'น้ำใส',money:500,day:1,hun:80,en:100,hp:100,joy:70,pond:[],am:.2,ni:0,na:0,bio:10,temp:28,water:96,o2:90,fed:0,
 fi:Object.fromEntries(Object.keys(FISH).map(k=>[k,0])),inv:Object.fromEntries(Object.keys(ING).map(k=>[k,0])),stock:[{k:'dried',q:2,a:0}],proc:[],eq:{},pr:{},pp:{},
 dz:{type:'flood',start:7,sev:.5},act:null,power:true,mkClosed:false,dmg:false,repair:0,earned:0,rep:null,tut:0,tutOk:-1,goal:5,over:false,cookFish:''});
function migrate(o,v){const b=def();const s=Object.assign(b,o);s.fi=Object.assign(def().fi,o.fi||{});s.inv=Object.assign(def().inv,o.inv||{});
 if(v<4){s.stock=[];const f=o.food||{};for(const k in f)if(f[k]>0&&IT[k])s.stock.push({k,q:f[k],a:0});delete s.food;
  s.pond=(o.pond||[]).map(p=>({t:FISH[p.t]?p.t:'nila',g:p.g,h:p.h==null?100:p.h}));
  s.dz=o.dz&&o.dz.day?{type:o.dz.type,start:Math.max(o.dz.day,(o.day||1)+DZ[o.dz.type].lead),sev:o.dz.sev}:b.dz;
  s.eq=Object.assign({},o.eq||{});s.proc=[];s.act=null;s.goal=5}
 return s}
const calcWater=()=>{S.water=Math.max(0,Math.min(100,Math.round(100-S.am*22-S.ni*18-S.na*1.5-Math.max(0,S.temp-31)*3)))};
const wstat=()=>S.water>=80?['Excellent','#65A30D']:S.water>=60?['Good','#a3c94a']:S.water>=40?['Warning','#e9b949']:['Critical','#e0584d'];
function roll(){S.pp={...S.pr};for(const k in ING)S.pr[k]=Math.max(2,Math.round(ING[k][1]*(0.6+Math.random()*0.9)))}
function beep(f=520){if(!SND)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='square';g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.08)}catch(e){}}
function toast(m,bad){const d=document.createElement('div');d.textContent=m;if(bad)d.className='bad';$('toast').appendChild(d);beep(bad?180:620);setTimeout(()=>d.remove(),2600)}
function pay(c,e){if(S.money<c){toast('เงินไม่พอ ต้องใช้ '+c+' บาท',1);return false}if(S.en<e){toast('พลังงานไม่พอ ไปพักผ่อนที่บ้านก่อน',1);return false}S.money-=c;S.en-=e;return true}
const closed=()=>{if(S.mkClosed){toast('ตลาดปิดชั่วคราว เส้นทางถูกตัดขาดจากภัยพิบัติ',1);return true}return false};
const fishTotal=()=>Object.values(S.fi).reduce((a,b)=>a+b,0);
const mature=()=>S.pond.filter(f=>f.g>=100).length;
const ageOf=b=>IT[b.k].shelf-b.a;
const expired=b=>ageOf(b)<=0;
const near=b=>!expired(b)&&ageOf(b)<=Math.max(1,IT[b.k].shelf*.3);
const stCls=b=>expired(b)?['หมดอายุ','#e0584d']:near(b)?['ใกล้หมดอายุ','#e9b949']:['สด','#65A30D'];
const edible=()=>S.stock.filter(b=>!expired(b));
const servings=()=>edible().reduce((s,b)=>s+b.q,0);
const supplyHun=()=>edible().reduce((s,b)=>s+IT[b.k].hun*b.q,0);
const supplyDays=()=>Math.round(supplyHun()/NEED*10)/10;
const feedUnit=()=>S.pond.reduce((s,f)=>s+FISH[f.t].feed,0);
const feedCost=k=>[0,1,2,4][k]*feedUnit();
const warnDays=()=>S.dz&&S.dz.start-S.day>=1&&S.dz.start-S.day<=DZ[S.dz.type].lead?S.dz.start-S.day:0;
function protOf(type){const e=DZ[type].eq,ks=Object.keys(e);return ks.reduce((s,k)=>s+Math.min(1,(S.eq[k]||0)/e[k]),0)/ks.length}
function ready(){const D=DZ[S.dz.type],e=protOf(S.dz.type);return{e,pct:Math.round((e*.5+Math.min(1,supplyDays()/D.dur)*.3+(S.water>=60?.1:0)+(S.money>=100?.1:0))*100)}}
function addStock(k,q){const b=S.stock.find(x=>x.k===k&&x.a===0);if(b)b.q+=q;else S.stock.push({k,q,a:0})}
function go(s){cur=s;nav=true;render()}
// ----- save slots -----
const getSlots=()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}};
function putSlots(o){try{localStorage.setItem(SK,JSON.stringify(o));return true}catch(e){toast('บันทึกไม่ได้',1);return false}}
function saveGame(q){if(!S||!slotId||S.over)return;const o=getSlots();o[slotId]={v:SAVE_V,name:S.slotName,ts:Date.now(),S};if(putSlots(o)&&!q)toast('บันทึกเกมแล้ว')}
function loadSlot(i){const d=getSlots()[i];if(!d){toast('ช่องนี้ว่าง',1);return}if(d.v>SAVE_V||d.v<3){toast('เวอร์ชันเซฟไม่รองรับ',1);return}S=migrate(d.S,d.v);S.slotName=d.name;slotId=i;calcWater();selFish=null;toast('โหลดเกมแล้ว: '+d.name+(d.v<SAVE_V?' (แปลงเซฟเก่าเป็นเวอร์ชันใหม่)':''));enter()}
function newSlot(i,name){S=def();S.slotName=name;slotId=i;roll();S.pp={...S.pr};calcWater();selFish=null;saveGame(1);toast('สร้างเกมใหม่: '+name);enter()}
function renameSlot(i,name){const o=getSlots();if(!o[i])return;o[i].name=name;putSlots(o);if(S&&slotId===i)S.slotName=name;toast('เปลี่ยนชื่อแล้ว');render()}
function delSlot(i){const o=getSlots();delete o[i];putSlots(o);if(slotId===i)slotId=null;toast('ลบเซฟแล้ว');render()}
function cont(){const o=getSlots();let b=0;for(const i in o)if(!b||o[i].ts>o[b].ts)b=i;if(!b){toast('ยังไม่มีเซฟ',1);return}loadSlot(+b)}
function enter(){inGame=true;go(S.over?'over':'farm')}
function toTitle(){saveGame(1);inGame=false;S=null;slotId=null;go('menu')}
function dlg(m,fn,o){DLG={m,fn,inp:o&&o.inp,only:o&&o.only};render()}
function dlgOk(){const d=DLG,v=$('dlgin')?$('dlgin').value.trim():'';if(d.inp!==undefined&&!v){toast('กรุณาใส่ชื่อ',1);return}DLG=null;render();d.fn(v)}
function dlgNo(){DLG=null;render()}
// ----- actions -----
function pickFish(){if(S.cookFish&&S.fi[S.cookFish]>0)return S.cookFish;return Object.keys(S.fi).find(k=>S.fi[k]>0)||''}
function openFish(t){selFish=t;shopQ=1;render()}
function setQ(d){shopQ=Math.max(1,Math.min(CAP-S.pond.length||1,shopQ+d));render()}
function askBuy(t){const q=shopQ,tot=FISH[t].b*q;if(closed())return;if(S.pond.length+q>CAP){toast('พื้นที่ในบ่อไม่พอ (ว่าง '+(CAP-S.pond.length)+' ตัว)',1);return}if(S.money<tot){toast('เงินไม่พอ ต้องใช้ '+tot+' บาท',1);return}dlg('ยืนยันซื้อ'+FISH[t].n+' '+q+' ตัว รวม '+tot+' บาท? (เงินคงเหลือ '+(S.money-tot)+' บาท)',()=>buyFish(t,q))}
function buyFish(t,q){if(S.pond.length+q>CAP||S.money<FISH[t].b*q){toast('ซื้อไม่ได้ ตรวจเงินและพื้นที่บ่อ',1);return}S.money-=FISH[t].b*q;for(let i=0;i<q;i++)S.pond.push({t,g:0,h:100});buyT=30;toast('ซื้อ'+FISH[t].n+' '+q+' ตัว ปล่อยลงบ่อแล้ว');shopQ=1;render()}
function feed(k){if(!S.pond.length){toast('ยังไม่มีปลาในบ่อ',1);return}if(S.fed){toast('วันนี้ให้อาหารแล้ว',1);return}if(!pay(feedCost(k),3))return;S.fed=k;toast(['','ให้อาหารน้อย ปลาโตช้า','ให้อาหารพอดี ปลาโตดี','ให้อาหารมากเกินไป ของเสียจะสะสม'][k],k===3);render()}
function chWater(){if(!pay(20,8))return;S.am*=.3;S.ni*=.3;S.na*=.3;S.o2=Math.min(100,S.o2+15);calcWater();toast('เปลี่ยนน้ำแล้ว ของเสียลดลง');render()}
function air(){if(!pay(15,5))return;S.o2=100;toast('เติมอากาศแล้ว ออกซิเจนเต็ม');render()}
function catchFish(){const m=S.pond.filter(f=>f.g>=100);if(!m.length){toast('ยังไม่มีปลาที่โตพอจับ',1);return}if(!pay(0,10))return;m.forEach(f=>S.fi[f.t]++);S.pond=S.pond.filter(f=>f.g<100);catchT=30;toast('จับปลาได้ '+m.length+' ตัว');render()}
function sellFish(t){if(closed()||!S.fi[t])return;S.fi[t]--;S.money+=FISH[t].s;S.earned+=FISH[t].s;toast('ขาย'+FISH[t].n+' +'+FISH[t].s+' บาท');render()}
function buyIng(k){if(closed())return;if(!pay(S.pr[k],0))return;S.inv[k]++;toast('ซื้อ'+ING[k][0]);render()}
function askEq(k){if(closed())return;if(EQ[k].k&&0){}if(S.money<EQ[k].p){toast('เงินไม่พอ ต้องใช้ '+EQ[k].p+' บาท',1);return}dlg('ยืนยันซื้อ'+EQ[k].n+' ราคา '+EQ[k].p+' บาท?',()=>buyEq(k))}
